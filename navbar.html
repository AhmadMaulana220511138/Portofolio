<!-- NAVBAR (fragment): CSS navbar + variabel warna + <nav> dalam satu file.
     JS-nya ada di navbar.js -->
     <style>
        :root {
            --nav-h: 76px;
            --ink: #0a0a0b;
            --ink-soft: #1c1c1f;
            --muted: #6b6b73;
            --line: #ececef;
            --bg: #ffffff;
            --bg-soft: #fafafb;
            --radius: 16px;
        }
    
        * { box-sizing: border-box; }
    
        html {
            scroll-behavior: smooth;
            scroll-padding-top: calc(var(--nav-h) + 20px);
        }
    
        body {
            margin: 0;
            padding-top: var(--nav-h);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: var(--ink);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
    
        ::selection { background: var(--ink); color: #fff; }
    
        /* ===== NAVBAR: SELALU DI ATAS SAAT SCROLL ===== */
        #mainNavbar {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100%;
            z-index: 99999;
    
            padding: 18px 0;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: saturate(180%) blur(16px);
            -webkit-backdrop-filter: saturate(180%) blur(16px);
            border-bottom: 1px solid var(--line);
    
            transition: padding .3s ease, box-shadow .3s ease, background .3s ease;
        }
    
        #mainNavbar.scrolled {
            padding: 11px 0;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
        }
    
        #mainNavbar .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            padding: 0;
        }
    
        .logo-icon {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            background: var(--ink);
            color: #fff;
            border-radius: 11px;
            font-size: 18px;
            font-weight: 800;
            transition: transform .35s ease, border-radius .35s ease;
        }
    
        .navbar-brand:hover .logo-icon {
            transform: rotate(-8deg) scale(1.08);
            border-radius: 50%;
        }
    
        .logo-text {
            color: var(--ink);
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.04em;
        }
    
        .logo-text span { color: #9a9aa2; }
    
        #mainNavbar .navbar-nav { align-items: center; gap: 6px; }
    
        #mainNavbar .nav-link {
            position: relative;
            padding: 10px 14px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
            transition: color .25s ease, transform .25s ease;
        }
    
        #mainNavbar .nav-link::after {
            content: "";
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 4px;
            height: 2px;
            background: var(--ink);
            border-radius: 10px;
            transform: scaleX(0);
            transition: transform .3s ease;
        }
    
        #mainNavbar .nav-link:hover,
        #mainNavbar .nav-link.active { color: var(--ink); }
    
        #mainNavbar .nav-link:hover { transform: translateY(-2px); }
    
        #mainNavbar .nav-link:hover::after,
        #mainNavbar .nav-link.active::after { transform: scaleX(1); }
    
        .nav-contact {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-left: 16px;
            padding: 11px 20px;
            background: var(--ink);
            color: #fff;
            border: 1px solid var(--ink);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition: all .3s ease;
        }
    
        .nav-contact:hover {
            background: #fff;
            color: var(--ink);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
    
        .contact-arrow { transition: transform .3s ease; }
        .nav-contact:hover .contact-arrow { transform: translate(3px, -3px); }
    
        #mainNavbar .navbar-toggler {
            padding: 8px 10px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            box-shadow: none !important;
        }
    
        @media (max-width: 1199.98px) {
            #mainNavbar .nav-link { padding: 10px; font-size: 13px; }
            #mainNavbar .nav-link::after { left: 10px; right: 10px; }
            .nav-contact { margin-left: 8px; padding: 10px 16px; font-size: 13px; }
        }
    
        @media (max-width: 991.98px) {
            :root { --nav-h: 68px; }
    
            #mainNavbar { padding: 14px 0; }
            #mainNavbar.scrolled { padding: 10px 0; }
    
            #mainNavbar .navbar-collapse {
                max-height: calc(100vh - var(--nav-h));
                overflow-y: auto;
                padding: 16px 0 8px;
            }
    
            #mainNavbar .navbar-nav { align-items: stretch; gap: 0; }
            #mainNavbar .nav-link { padding: 13px 4px; font-size: 15px; }
            #mainNavbar .nav-link::after { left: 4px; right: auto; width: 32px; bottom: 7px; }
    
            .nav-contact { width: 100%; margin: 14px 0 6px; padding: 14px; }
        }
    
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
    
    <nav class="navbar navbar-expand-lg" id="mainNavbar">
        <div class="container">
    
            <a class="navbar-brand" href="index.html#home" aria-label="Home">
                <span class="logo-icon">My</span>
                <span class="logo-text">Portfolio<span>.</span></span>
            </a>
    
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                    aria-controls="navbarMenu" aria-expanded="false"
                    aria-label="Buka navigasi">
                <span class="navbar-toggler-icon"></span>
            </button>
    
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#education">
                            Pendidikan
                        </a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="index.html#skills">Skills</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="certifications.html">Certifications</a></li>
                </ul>
    
                <a href="index.html#contact" class="nav-contact">
                    Contact <span class="contact-arrow">↗</span>
                </a>
            </div>
        </div>
    </nav>
